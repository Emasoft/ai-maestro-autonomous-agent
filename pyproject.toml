[project]
name = "ai-maestro-autonomous-agent"
version = "1.6.8"
description = "Autonomous Agent plugin for AI Maestro"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pyyaml"]

[tool.ruff]
line-length = 320

[tool.mypy]
ignore_missing_imports = true

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pytest-split>=0.9",
]
