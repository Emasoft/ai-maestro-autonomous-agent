[project]
name = "ai-maestro-autonomous-agent"
version = "1.6.19"
description = "Autonomous Agent plugin for AI Maestro"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["pyyaml"]

[tool.ruff]
line-length = 320

[tool.mypy]
ignore_missing_imports = true

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pytest-split>=0.9",
]

[tool.pytest.ini_options]
# Pin collection to tests/ — gitignored scratch dirs (reports_dev/, docs_dev/)
# accumulate stray *.py copies that otherwise break bare `pytest` collection.
testpaths = ["tests"]
