# git-cliff config — auto-generated by publish.py
# https://git-cliff.org/docs/configuration
#
# DELIBERATE DIVERGENCE FROM CPV CANON — declared in `.claude-plugin/plugin.json`
# under `cpv.pipeline.intentional_divergence`, so `standardize --force-templates`
# skips this file instead of regressing it.
#
# The one thing that must never be taken from canon is the BODY TEMPLATE's
# indentation. Canon writes the section markers indented under a `\` line
# continuation (`    ## [`, `    ### `, `        - `). Tera keeps that leading
# whitespace, so every heading and bullet lands indented in CHANGELOG.md — a
# 4-space indent turns a heading into an indented paragraph and a bullet into a
# code block. TRDD-R3JRZURT fixed exactly that (commit b326c65); re-adopting
# canon's body here would re-introduce the bug. Everything else below IS canon.

[changelog]
header = """
# Changelog

All notable changes to this project will be documented in this file.

"""
body = """
{% if version %}## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}## [Unreleased]
{% endif %}{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}[**breaking**] {% endif %}{% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.id %} ({{ commit.id | truncate(length=7, end="") }}){% endif %}{% endfor %}
{% endfor %}
"""
trim = true
# From canon, and load-bearing rather than decorative: git-cliff emits a newline
# after the last rendered release body, so with `footer = ""` the generated
# CHANGELOG.md ended on a blank line and tripped markdownlint MD012 on every
# release. The footer gives that newline something to terminate, so the file now
# ends on a real line.
footer = """
---
*Generated by [git-cliff](https://git-cliff.org)*
"""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
# From canon. First rule turns a bare `(#123)` into a link to the issue, so the
# changelog is navigable; second strips trailing whitespace off a commit subject
# before it becomes a bullet (an unstripped subject renders as a hard line break
# and trips markdownlint MD009 on the generated file).
commit_preprocessors = [
  { pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](https://github.com/Emasoft/ai-maestro-autonomous-agent/issues/${2}))" },
  { pattern = '\s+$', replace = "" },
]
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^doc", group = "Documentation" },
  { message = "^perf", group = "Performance" },
  { message = "^refactor", group = "Refactor" },
  { message = "^style", group = "Styling" },
  { message = "^test", group = "Testing" },
  # Release/housekeeping commits are pipeline noise, not project history. The
  # old narrow `^chore\(release\): prepare for` matched nothing this repo
  # actually writes (publish.py commits `chore(release): v1.2.3`), so every
  # release commit leaked into the changelog as a bare version bullet.
  { message = "^chore\\(release\\)", skip = true },
  { message = "^release", skip = true },
  { message = "^chore\\(deps\\)", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci", group = "Miscellaneous Tasks" },
  { message = "^security", group = "Security" },
  { body = ".*security", group = "Security" },
  { message = "^revert", group = "Revert" },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = "v0.0.0"
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
